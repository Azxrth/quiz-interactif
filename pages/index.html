<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Quiz Dynamique</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <h1>Quiz Dynamique</h1>

    <div id="intro-screen">
      <p class="notice">
        Testez vos connaissances en quelques questions chronométrées !
      </p>
      <p>Meilleur score : <span id="best-score-value">0</span></p>
      <label class="mode-toggle">
        <input type="checkbox" id="time-trial-toggle" />
        Mode contre-la-montre (temps global)
      </label>
      <label class="mode-config">
        Durée du mode contre-la-montre (secondes)
        <input
          type="number"
          id="time-trial-duration"
          min="30"
          max="900"
          value="150"
        />
      </label>
      <button id="start-btn">Commencer le quiz</button>
    </div>

    <div id="question-screen" style="display: none">
      <div id="progress">
        Question <span id="current-question-index"></span> /
        <span id="total-questions"></span>
      </div>
      <div id="global-timer-div" class="timer" style="display: none">
        Temps global restant : <span id="global-time-left">0</span>s
      </div>
      <p id="question-text"></p>
      <div id="answers"></div>
      <div id="timer-div" class="timer">
        Temps restant : <span id="time-left">0</span>s
      </div>
      <button id="next-btn" class="hidden">Question suivante</button>
    </div>

    <div id="result-screen" style="display: none">
      <h2>Résultat final</h2>
      <p id="score-text"></p>
      <p>Meilleur score : <span id="best-score-end">0</span></p>
      <button id="restart-btn">Recommencer</button>
    </div>

    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
